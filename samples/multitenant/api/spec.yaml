openapi: 3.0.3

info:
  title: Company Todo API
  description: |
    Example golite API where each company has its own SQLite database. The
    master database lists the companies; /v1/companies/{company}/... routes
    run against that company's database.
  version: 1.0.0

servers:
  - url: http://localhost:7880
    description: Local dev server

paths:

  /v1/companies:
    get:
      operationId: listCompanies
      summary: List companies
      tags:
        - Companies
      responses:
        '200':
          description: Companies found
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Company'
    post:
      operationId: createCompany
      summary: Create a company
      description: Creates the company in the master database, and its own database.
      tags:
        - Companies
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCompanyRequest'
      responses:
        '201':
          description: Company created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/companies/{company}:
    parameters:
      - $ref: '#/components/parameters/CompanySlug'
    get:
      operationId: getCompany
      summary: Get a company
      tags:
        - Companies
      responses:
        '200':
          description: Company found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateCompany
      summary: Update a company
      description: The change reaches the company's own database shortly after, by a background job.
      tags:
        - Companies
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCompanyRequest'
      responses:
        '200':
          description: Company updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteCompany
      summary: Delete a company
      description: |
        Deletes the company. Its database, with all its data, is removed by a
        background job once in-flight requests on it finish.
      tags:
        - Companies
      responses:
        '204':
          description: Company deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/companies/{company}/slug:
    parameters:
      - $ref: '#/components/parameters/CompanySlug'
    put:
      operationId: updateSlug
      summary: Change a company's slug
      description: |
        The company is at its new URL straight away. Its database file,
        named after the slug, is renamed once requests in flight on it
        finish; meanwhile its task routes may briefly answer 503.
      tags:
        - Companies
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSlugRequest'
      responses:
        '200':
          description: Slug changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/companies/{company}/tasks:
    parameters:
      - $ref: '#/components/parameters/CompanySlug'
    get:
      operationId: listTasks
      summary: List tasks
      tags:
        - Tasks
      parameters:
        - name: done
          in: query
          required: false
          description: Only return tasks that are (or aren't) done.
          schema:
            type: boolean
      responses:
        '200':
          description: Tasks found
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: createTask
      summary: Create a task
      tags:
        - Tasks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '201':
          description: Task created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/companies/{company}/tasks/{id}:
    parameters:
      - $ref: '#/components/parameters/CompanySlug'
      - $ref: '#/components/parameters/TaskID'
    get:
      operationId: getTask
      summary: Get a task
      tags:
        - Tasks
      responses:
        '200':
          description: Task found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateTask
      summary: Update a task
      description: Only the fields given are changed.
      tags:
        - Tasks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskRequest'
      responses:
        '200':
          description: Task updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteTask
      summary: Delete a task
      tags:
        - Tasks
      responses:
        '204':
          description: Task deleted
        '404':
          $ref: '#/components/responses/NotFound'

components:

  parameters:
    CompanySlug:
      name: company
      in: path
      required: true
      description: The company's slug.
      schema:
        type: string
    TaskID:
      name: id
      in: path
      required: true
      description: Task ID. IDs are strings on the wire.
      schema:
        type: string

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Not found (including an unknown company)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Already exists
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Company:
      type: object
      required: [slug, name, created_at]
      properties:
        slug:
          type: string
          example: acme
        name:
          type: string
          example: Acme Corp
        created_at:
          type: string
          format: date-time

    CreateCompanyRequest:
      type: object
      required: [slug, name]
      properties:
        slug:
          type: string
          description: |
            URL-safe key used in /v1/companies/{company}, and in the name of
            the company's database file. Lowercase letters, digits and '-'.
          pattern: '^[a-z0-9][a-z0-9-]{0,62}$'
        name:
          type: string
          minLength: 1

    UpdateCompanyRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1

    UpdateSlugRequest:
      type: object
      required: [slug]
      properties:
        slug:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{0,62}$'

    Task:
      type: object
      required: [id, title, notes, done, created_at, completed_at]
      properties:
        id:
          type: string
          example: "1"
        title:
          type: string
          example: Buy milk
        notes:
          type: string
          nullable: true
        done:
          type: boolean
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true

    CreateTaskRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
        notes:
          type: string

    UpdateTaskRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        notes:
          type: string
          description: An empty string clears the notes.
        done:
          type: boolean

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
